[project]
name = "codex-acp-gateway-integration-tests"
version = "0.1.0"
description = "Integration tests for codex-acp-gateway"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default timeout per test (seconds) — tool use / multi-turn can be slow
timeout = 120
# Show full assertion introspection
addopts = ["-v", "--tb=short", "-s"]
markers = [
    "slow: marks tests that are slow (launch gateway + Gemini each time)",
]
