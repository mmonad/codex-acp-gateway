[workspace]
members = [
    ".",
    "crates/app-server-protocol",
    "crates/file-search",
    "crates/protocol",
    "crates/codex-experimental-api-macros",
    "crates/execpolicy",
    "crates/utils/absolute-path",
    "crates/utils/cache",
    "crates/utils/image",
    "crates/utils/git",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mmonad/codex-acp-gateway"

[workspace.dependencies]
# Internal path dependencies (vendored from codex)
codex-app-server-protocol = { path = "crates/app-server-protocol" }
codex-experimental-api-macros = { path = "crates/codex-experimental-api-macros" }
codex-execpolicy = { path = "crates/execpolicy" }
codex-git = { path = "crates/utils/git" }
codex-protocol = { path = "crates/protocol" }
codex-utils-absolute-path = { path = "crates/utils/absolute-path" }
codex-utils-cache = { path = "crates/utils/cache" }
codex-file-search = { path = "crates/file-search" }
codex-utils-image = { path = "crates/utils/image" }

# ACP protocol
agent-client-protocol = { version = "0.9", features = ["unstable"] }

# External (versions from codex workspace)
anyhow = "1"
base64 = "0.22.1"
clap = "4"
crossbeam-channel = "0.5.15"
dirs = "6"
ignore = "0.4.23"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
image = { version = "^0.25.9", default-features = false }
inventory = "0.3.19"
lru = "0.16.3"
mime_guess = "2.0.5"
multimap = "0.10.0"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
once_cell = "1.20.2"
path-absolutize = "3.1.1"
pretty_assertions = "1.4.1"
schemars = "0.8.22"
serde = "1"
serde_json = "1"
serde_with = "3.16"
sha1 = "0.10.6"
shlex = "1.3.0"
similar = "2.7.0"
starlark = "0.13.0"
strum = "0.27.2"
strum_macros = "0.27.2"
sys-locale = "0.3.2"
tempfile = "3.23.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "2.0.17"
tokio = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
ts-rs = "11"
uuid = "1"
walkdir = "2.5.0"
assert_matches = "1.5"
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = "0.26"
tokio-util = "0.7"

[workspace.lints]
rust = {}

[package]
name = "codex-acp-gateway"
description = "Protocol translation gateway between Codex app-server clients and ACP agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "codex-acp-gateway"
path = "src/main.rs"

[dependencies]
# Internal (vendored from codex)
codex-app-server-protocol = { workspace = true }
codex-file-search = { workspace = true }
codex-protocol = { workspace = true }

# ACP protocol
agent-client-protocol = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Utilities
uuid = { workspace = true, features = ["serde", "v7"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
similar = { workspace = true }
dirs = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
time = { workspace = true }

[dev-dependencies]
codex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
